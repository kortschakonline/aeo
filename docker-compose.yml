# Deployment-Ziel: VPS srv.jrn.digital, Traefik läuft im host-Modus mit Docker-Provider
# (exposedbydefault=false), Entrypoint websecure (:443), HTTP-Challenge-Certresolver "letsencrypt".
# App und DB liegen auf dem (compose-default) Netzwerk; Traefik findet die App über den Docker-Socket.
services:
  app:
    image: ghcr.io/kortschakonline/aeo:latest
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://aeo:${DB_PASS}@db:5432/aeo
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aeo.rule=Host(`aeo.kortschak.online`)"
      - "traefik.http.routers.aeo.entrypoints=websecure"
      - "traefik.http.routers.aeo.tls.certresolver=letsencrypt"
      - "traefik.http.services.aeo.loadbalancer.server.port=3000"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aeo
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=aeo
    volumes:
      - aeo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aeo-db:
